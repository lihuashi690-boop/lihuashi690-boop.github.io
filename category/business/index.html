<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#F5F3EE"><meta name="description" content="按表格分类，逐位浏览博主每日更新、精选摘要与信息统计。"><title>见微 · 分类阅读台</title><link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/style.css?v=20260912"><script src="/static/config.js"></script><script defer src="/static/static-data.js?v=20260913"></script><script defer src="/static/app.js?v=20260913"></script></head>
<body>
<a class="skip-link" href="#main">跳到内容</a>
<header class="site-header"><div class="header-inner"><a class="brand" href="/category/ai" data-route aria-label="见微分类阅读台"><span class="brand-symbol" aria-hidden="true">见</span><span class="brand-name">见微</span><span class="brand-label">分类阅读台</span></a><div class="header-actions"><span id="header-status" class="header-status">读取来源状态…</span><button id="fetch-button" class="text-button"><span data-icon="refresh"></span><span>检查更新</span></button><span class="header-divider"></span><button id="font-button" class="icon-button font-button" aria-label="阅读字号">Aa</button><button id="settings-button" class="icon-button" aria-label="更新设置"><span data-icon="settings"></span></button></div></div></header>
<div class="category-nav-wrap"><nav id="category-nav" class="category-nav" aria-label="表格大分类"></nav></div>
<main id="main" tabindex="-1"><div class="loading-state">正在读取博主更新…</div></main>
<footer class="site-footer"><span>见微 · 1,350 个来源，按表格归类</span><button class="text-button" data-status>查看采集状态 <span data-icon="arrow-right"></span></button></footer>
<dialog id="reader-dialog" class="reader-dialog"><div class="dialog-top"><span class="dialog-caption">来源阅读</span><div class="dialog-tools"><button class="icon-button" data-font="-1" aria-label="减小字号">A−</button><button class="icon-button" data-font="1" aria-label="增大字号">A＋</button><button class="icon-button" data-close="reader-dialog" aria-label="关闭阅读"><span data-icon="close"></span></button></div></div><div id="reader-content"></div></dialog>
<dialog id="settings-dialog" class="settings-dialog"><div class="dialog-top"><h2>更新设置</h2><button class="icon-button" data-close="settings-dialog" aria-label="关闭设置"><span data-icon="close"></span></button></div><form id="settings-form"><div class="form-two"><label>报告生成时间<select name="report_hour"></select></label><label>时区<select name="timezone"><option value="Asia/Shanghai">北京时间</option><option value="Asia/Tokyo">东京时间</option><option value="UTC">UTC</option></select></label></div><div class="form-two"><label>核心源检查间隔<select name="core_interval_hours"><option value="2">每 2 小时</option><option value="4">每 4 小时</option><option value="6">每 6 小时</option></select></label><label>普通源检查间隔<select name="normal_interval_hours"><option value="6">每 6 小时</option><option value="12">每 12 小时</option><option value="24">每 24 小时</option></select></label></div><p class="settings-note">更新由本机独立任务执行。浏览页面只读取已保存的内容。</p><div class="form-actions"><span class="small">Source Han Serif SC VF · Regular</span><button class="primary-button" type="submit">保存设置</button></div></form></dialog>
<dialog id="status-dialog" class="status-dialog"><div class="dialog-top"><h2>采集状态</h2><button class="icon-button" data-close="status-dialog" aria-label="关闭采集状态"><span data-icon="close"></span></button></div><div id="status-content"></div></dialog>
<div id="font-popover" class="font-popover" hidden><span>阅读正文字号</span><button data-font="-1" class="icon-button" aria-label="减小字号">A−</button><output id="font-value">18</output><button data-font="1" class="icon-button" aria-label="增大字号">A＋</button></div><div id="toast" role="status" aria-live="polite"></div><noscript>请启用 JavaScript 查看博主更新和分类统计。</noscript>
